<style>.s{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:'Courier New',Courier,monospace}
@keyframes slide{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes code{0%{transform:translateY(0)}100%{transform:translateY(-120px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.r{animation:slide .7s ease-out both}.lap{animation:bob 4s ease-in-out infinite}.cd{animation:code 6s linear infinite}
</style>
