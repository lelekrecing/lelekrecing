<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%">
<defs><linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#A78BFA"/><stop offset="1" stop-color="#34D399"/>
