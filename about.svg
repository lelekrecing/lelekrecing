<style>.s{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:'Courier New',Courier,monospace}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
@keyframes sway2{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-2deg)}}
@keyframes bobc{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes tapL{0%,100%{transform:translateY(0)}25%{transform:translateY(-5px)}}
@keyframes tapR{0%,100%{transform:translateY(0)}60%{transform:translateY(-5px)}}
@keyframes keyf{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes cup{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0);opacity:0}8%{opacity:.95}92%{opacity:.9}100%{transform:translate(-170px,400px) rotate(640deg);opacity:0}}
@keyframes win{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}4%{opacity:1}14%{transform:translate(-260px,150px);opacity:0}100%{transform:translate(-260px,150px);opacity:0}}
@keyframes glowp{0%,100%{opacity:.5}50%{opacity:.85}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.hb{transform-box:fill-box;transform-origin:50% 8%;animation:sway 5s ease-in-out infinite}
.hs{transform-box:fill-box;transform-origin:50% 0%;animation:sway2 4.2s ease-in-out infinite}
.bc{animation:bobc 4.5s ease-in-out infinite}
.aL{animation:tapL .55s ease-in-out infinite}.aR{animation:tapR .55s ease-in-out infinite}
.kf{animation:keyf 1.1s ease-in-out infinite}.cp{animation:cup 2s ease-in-out infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3s ease-in-out infinite}
.pt{animation:fall 11s linear infinite}
.wn{animation:win 3s ease-in-out infinite}
.sh{animation:shoot 9s linear infinite}
.gp{animation:glowp 6s ease-in-out infinite}

@keyframes lan{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes ember{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(30px,-280px);opacity:0}}
@keyframes slash{0%,89%{opacity:0;stroke-dashoffset:1000}90%{opacity:1;stroke-dashoffset:1000}93%{opacity:1;stroke-dashoffset:0}98%,100%{opacity:0;stroke-dashoffset:0}}
@keyframes flash{0%,91%,100%{opacity:0}93%{opacity:.18}}
@keyframes drift{0%{transform:translateX(-200px)}100%{transform:translateX(900px)}}
@keyframes glint{0%{stroke-dashoffset:100}60%,100%{stroke-dashoffset:-20}}
@keyframes tail{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(9deg)}}
.lan{transform-box:fill-box;transform-origin:50% 0;animation:lan 4s ease-in-out infinite}
.em{animation:ember 7s linear infinite}
.sl{stroke-dasharray:1000;animation:slash 9s linear infinite}
.fl{animation:flash 9s linear infinite}
.mi{animation:drift 26s linear infinite}
.gl{stroke-dasharray:14 100;animation:glint 4s linear infinite}
.tl{transform-box:fill-box;transform-origin:0% 50%;animation:tail 2.6s ease-in-out infinite}
.u1{animation:up .8s ease-out both}.u2{animation:up .8s .25s ease-out both}.u3{animation:up .8s .5s ease-out both}.u4{animation:up .8s .75s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

@keyframes idle{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
@keyframes bglow{0%,100%{opacity:.12}50%{opacity:.4}}
@keyframes scarf{0%,100%{transform:rotate(-5deg) skewY(0)}50%{transform:rotate(7deg) skewY(4deg)}}
@keyframes hem{0%,100%{transform:skewX(-1.5deg)}50%{transform:skewX(1.5deg)}}
.idle{transform-box:fill-box;transform-origin:50% 100%;animation:idle 5s ease-in-out infinite}
.bg2{animation:bglow 2.4s ease-in-out infinite}
.sc{transform-box:fill-box;transform-origin:100% 50%;animation:scarf 2.2s ease-in-out infinite}
.hm{transform-box:fill-box;transform-origin:50% 0;animation:hem 3.4s ease-in-out infinite}

@keyframes slide{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.r{animation:slide .7s ease-out both}</style>
