<svg width="900" height="250" viewBox="0 0 900 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#061224" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E3A5F" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>

    <!-- Scanline Gradient -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Courier, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes spinRadar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes scanMove {
      0% { transform: translateY(-40px); }
      100% { transform: translateY(250px); }
    }
    @keyframes pulseRing {
      0% { r: 12; opacity: 0.8; }
      100% { r: 42; opacity: 0; }
    }

    .blink-fast { animation: blink 1.2s infinite; }
    .blink-slow { animation: blink 2.8s infinite; }
    .float-ship { animation: float 3.5s ease-in-out infinite; }
    .radar-sweep { transform-origin: 145px 140px; animation: spinRadar 4s linear infinite; }
    .scanline { animation: scanMove 5s linear infinite; }
    .pulse-circle { animation: pulseRing 2.5s ease-out infinite; }
  </style>

  <!-- Base & Grid -->
  <rect width="900" height="250" rx="12" fill="url(#bgGrad)" />
  <rect width="900" height="250" rx="12" fill="url(#grid)" />

  <!-- Animated Scanline -->
  <rect x="0" y="0" width="900" height="35" fill="url(#scanGrad)" class="scanline" />

  <!-- Outer Cyber Frame & Corner Brackets -->
  <rect x="10" y="10" width="880" height="230" rx="8" stroke="#1E3A5F" stroke-width="1.5" />
  <path d="M 10 35 L 10 10 L 35 10" stroke="#38BDF8" stroke-width="3" fill="none" />
  <path d="M 865 10 L 890 10 L 890 35" stroke="#38BDF8" stroke-width="3" fill="none" />
  <path d="M 10 215 L 10 240 L 35 240" stroke="#38BDF8" stroke-width="3" fill="none" />
  <path d="M 865 240 L 890 240 L 890 215" stroke="#38BDF8" stroke-width="3" fill="none" />

  <!-- Top Telemetry Bar -->
  <line x1="10" y1="42" x2="890" y2="42" stroke="#1E3A5F" stroke-width="1" />
  <circle cx="28" cy="26" r="4.5" fill="#22C55E" class="blink-fast" />
  <text x="42" y="30" fill="#94A3B8" font-size="11" font-weight="bold" letter-spacing="1.5" class="mono">[ CODENAME : LELEKRECING ]</text>
  <text x="315" y="30" fill="#FACC15" font-size="11" font-weight="bold" letter-spacing="1.2" class="mono">★ STACK: LARAVEL • PHP • JS</text>
  <text x="615" y="30" fill="#38BDF8" font-size="11" font-weight="bold" letter-spacing="1.2" class="mono">MISSION: FULLSTACK DEV</text>

  <!-- Twinkling Background Stars -->
  <circle cx="70" cy="80" r="1.5" fill="#FFFFFF" class="blink-slow" />
  <circle cx="235" cy="68" r="2" fill="#38BDF8" class="blink-fast" />
  <circle cx="215" cy="195" r="1.5" fill="#FFFFFF" class="blink-slow" />
  <circle cx="65" cy="205" r="2" fill="#38BDF8" class="blink-fast" />
  <circle cx="845" cy="75" r="2" fill="#38BDF8" class="blink-slow" />
  <circle cx="825" cy="210" r="1.5" fill="#FFFFFF" class="blink-fast" />

  <!-- Left Animated Radar & Pixel Rocket -->
  <g>
    <!-- Radar Circles -->
    <circle cx="145" cy="140" r="58" stroke="#1E3A5F" stroke-width="1.2" stroke-dasharray="4 4" />
    <circle cx="145" cy="140" r="38" stroke="#1E3A5F" stroke-width="1" />
    <circle cx="145" cy="140" r="12" stroke="#38BDF8" stroke-width="1.5" fill="none" class="pulse-circle" />
    
    <!-- Rotating Radar Line -->
    <g class="radar-sweep">
      <line x1="145" y1="140" x2="145" y2="82" stroke="#38BDF8" stroke-width="2" filter="url(#cyanGlow)" />
      <path d="M 145 140 L 145 82 A 58 58 0 0 1 186 99 Z" fill="#38BDF8" fill-opacity="0.15" />
    </g>

    <!-- Floating Pixel Art Rocket / Satellite -->
    <g class="float-ship" transform="translate(123, 114)">
      <!-- Rocket Body -->
      <rect x="16" y="4" width="12" height="8" fill="#38BDF8" />
      <rect x="12" y="12" width="20" height="20" fill="#F8FAFC" />
      <rect x="18" y="16" width="8" height="8" fill="#0F172A" />
      <rect x="20" y="18" width="4" height="4" fill="#38BDF8" />
      <!-- Wings -->
      <rect x="6" y="24" width="6" height="10" fill="#EF4444" />
      <rect x="32" y="24" width="6" height="10" fill="#EF4444" />
      <!-- Thruster Flame -->
      <rect x="16" y="32" width="12" height="6" fill="#FACC15" class="blink-fast" />
      <rect x="19" y="38" width="6" height="6" fill="#F97316" class="blink-fast" />
    </g>
  </g>

  <!-- Right Main Terminal Card -->
  <rect x="275" y="60" width="585" height="162" rx="8" fill="#071326" fill-opacity="0.88" stroke="#2563EB" stroke-width="1.2" />
  
  <!-- Badge Header inside Card -->
  <rect x="295" y="74" width="265" height="22" rx="4" fill="#1E3A8A" fill-opacity="0.6" stroke="#38BDF8" stroke-width="0.8" />
  <text x="306" y="89" fill="#38BDF8" font-size="11" font-weight="bold" letter-spacing="1.5" class="mono">SYSTEM ARCHITECT // CLASS S</text>

  <!-- Main Title Name -->
  <text x="295" y="132" fill="#FFFFFF" font-size="34" font-weight="800" letter-spacing="3" class="sans" filter="url(#cyanGlow)">LELEKRECING</text>
  
  <!-- Subtitle Roles -->
  <text x="295" y="156" fill="#93C5FD" font-size="12.5" font-weight="bold" letter-spacing="1.8" class="mono">WEB DEVELOPER • LARAVEL SPECIALIST • BUILDER</text>

  <!-- Terminal Prompt Line -->
  <text x="295" y="184" fill="#38BDF8" font-size="12" font-weight="bold" letter-spacing="1" class="mono">> BUILDING SCALABLE DIGITAL SYSTEMS<tspan class="blink-fast">_</tspan></text>

  <!-- Bottom Status Footer inside Card -->
  <line x1="295" y1="196" x2="840" y2="196" stroke="#1E3A5F" stroke-width="1" />
  <text x="295" y="211" fill="#64748B" font-size="10.5" font-weight="bold" letter-spacing="1" class="mono">SYS: <tspan fill="#22C55E">ONLINE</tspan> | RADAR: <tspan fill="#38BDF8">ACTIVE</tspan> | ENV: <tspan fill="#E2E8F0">LARAGON & GIT</tspan></text>
</svg>
