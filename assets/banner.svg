<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 360"
     width="1200"
     height="360">

  <defs>

    <!-- Background Gradient -->
    <linearGradient id="bg"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%" stop-color="#020617"/>

      <stop offset="50%" stop-color="#0F172A"/>

      <stop offset="100%" stop-color="#020617"/>

    </linearGradient>

    <!-- Neon Gradient -->
    <linearGradient id="neon"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">

      <stop offset="0%" stop-color="#38BDF8">

        <animate
          attributeName="stop-color"
          values="#38BDF8;#818CF8;#34D399;#38BDF8"
          dur="5s"
          repeatCount="indefinite"/>

      </stop>

      <stop offset="100%" stop-color="#818CF8">

        <animate
          attributeName="stop-color"
          values="#818CF8;#34D399;#38BDF8;#818CF8"
          dur="5s"
          repeatCount="indefinite"/>

      </stop>

    </linearGradient>

    <!-- Grid -->
    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse">

      <path
        d="M 40 0 L 0 0 0 40"
        fill="none"
        stroke="#1E293B"
        stroke-width="1"/>

    </pattern>

    <!-- Glow -->
    <filter id="glow">

      <feGaussianBlur
        stdDeviation="5"
        result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>

        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>

  </defs>


  <!-- ======================== -->
  <!-- BACKGROUND -->
  <!-- ======================== -->

  <rect
    width="1200"
    height="360"
    rx="18"
    fill="url(#bg)"/>


  <!-- ======================== -->
  <!-- GRID -->
  <!-- ======================== -->

  <rect
    width="1200"
    height="360"
    rx="18"
    fill="url(#grid)"
    opacity="0.45"/>


  <!-- ======================== -->
  <!-- BORDER -->
  <!-- ======================== -->

  <rect
    x="3"
    y="3"
    width="1194"
    height="354"
    rx="16"
    fill="none"
    stroke="url(#neon)"
    stroke-width="3"/>


  <!-- ======================== -->
  <!-- MOVING LIGHT -->
  <!-- ======================== -->

  <rect
    x="-300"
    y="0"
    width="300"
    height="360"
    fill="url(#neon)"
    opacity="0.05">

    <animate
      attributeName="x"
      from="-300"
      to="1200"
      dur="7s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ======================== -->
  <!-- STATUS -->
  <!-- ======================== -->

  <rect
    x="70"
    y="55"
    width="235"
    height="32"
    rx="16"
    fill="#0F172A"
    stroke="#334155"/>


  <circle
    cx="91"
    cy="71"
    r="5"
    fill="#10B981">

    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <text
    x="108"
    y="76"
    fill="#94A3B8"
    font-family="monospace"
    font-size="12"
    font-weight="bold"
    letter-spacing="1.5">

    SYSTEM ONLINE // ACTIVE

  </text>


  <!-- ======================== -->
  <!-- MAIN TITLE -->
  <!-- ======================== -->

  <text
    x="70"
    y="160"
    fill="#F8FAFC"
    font-family="Arial, Helvetica, sans-serif"
    font-size="56"
    font-weight="900"
    letter-spacing="5">

    LELEKRECING

  </text>


  <!-- ======================== -->
  <!-- ANIMATED LINE -->
  <!-- ======================== -->

  <rect
    x="70"
    y="178"
    width="150"
    height="5"
    rx="3"
    fill="url(#neon)">

    <animate
      attributeName="width"
      values="150;380;150"
      dur="4s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ======================== -->
  <!-- SUBTITLE -->
  <!-- ======================== -->

  <text
    x="70"
    y="220"
    fill="#38BDF8"
    font-family="monospace"
    font-size="18"
    font-weight="bold">

    FULLSTACK WEB &amp; MOBILE DEVELOPER

  </text>


  <text
    x="70"
    y="250"
    fill="#94A3B8"
    font-family="monospace"
    font-size="14">

    PHP • LARAVEL • NODE.JS • FLUTTER • MYSQL • POSTGRESQL

  </text>


  <!-- ======================== -->
  <!-- TERMINAL DECORATION -->
  <!-- ======================== -->

  <g transform="translate(70,285)">

    <circle cx="8" cy="8" r="4" fill="#38BDF8"/>

    <circle cx="24" cy="8" r="4" fill="#818CF8"/>

    <circle cx="40" cy="8" r="4" fill="#34D399"/>

    <text
      x="58"
      y="13"
      fill="#64748B"
      font-family="monospace"
      font-size="12">

      ~/developer/core

    </text>

  </g>


  <!-- ======================== -->
  <!-- RIGHT CYBER CORE -->
  <!-- ======================== -->

  <g transform="translate(1000,180)">

    <!-- Outer Ring -->

    <circle
      r="92"
      fill="none"
      stroke="url(#neon)"
      stroke-width="2"
      stroke-dasharray="18 12">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="18s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Middle Ring -->

    <circle
      r="68"
      fill="none"
      stroke="#38BDF8"
      stroke-width="1.5"
      stroke-dasharray="25 15"
      opacity="0.7">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360"
        to="0"
        dur="10s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Inner Ring -->

    <circle
      r="48"
      fill="#0F172A"
      stroke="url(#neon)"
      stroke-width="2"
      filter="url(#glow)"/>


    <!-- Code Symbol -->

    <path
      d="M-18 -12 L-32 0 L-18 12"
      fill="none"
      stroke="#38BDF8"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"/>


    <path
      d="M18 -12 L32 0 L18 12"
      fill="none"
      stroke="#818CF8"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"/>


    <line
      x1="7"
      y1="-17"
      x2="-7"
      y2="17"
      stroke="#34D399"
      stroke-width="4"
      stroke-linecap="round"/>

  </g>


  <!-- ======================== -->
  <!-- BOTTOM WAVE -->
  <!-- ======================== -->

  <path
    d="M0 315 Q300 275 600 315 T1200 315 L1200 360 L0 360 Z"
    fill="#38BDF8"
    opacity="0.08">

    <animate
      attributeName="d"
      values="
      M0 315 Q300 275 600 315 T1200 315 L1200 360 L0 360 Z;
      M0 315 Q300 345 600 315 T1200 315 L1200 360 L0 360 Z;
      M0 315 Q300 275 600 315 T1200 315 L1200 360 L0 360 Z"
      dur="6s"
      repeatCount="indefinite"/>

  </path>

</svg>
