<svg width="900" height="270" viewBox="0 0 900 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#040D21" />
    </linearGradient>
    <linearGradient id="cyberLine" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.75" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E3A8A" stroke-width="0.7" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background & Grid -->
  <rect width="900" height="270" rx="14" fill="url(#bg)" />
  <rect width="900" height="270" rx="14" fill="url(#grid)" />

  <!-- Animated Scanline Bar -->
  <rect x="0" y="0" width="900" height="3" fill="url(#cyberLine)">
    <animate attributeName="y" values="0;270;0" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- Outer Cyber Frame -->
  <rect x="8" y="8" width="884" height="254" rx="10" stroke="#1E3A8A" stroke-width="1.5" />
  <!-- Corner Accents -->
  <path d="M 8 36 L 8 8 L 36 8" stroke="#38BDF8" stroke-width="3" />
  <path d="M 864 8 L 892 8 L 892 36" stroke="#38BDF8" stroke-width="3" />
  <path d="M 8 234 L 8 262 L 36 262" stroke="#8B5CF6" stroke-width="3" />
  <path d="M 864 262 L 892 262 L 892 234" stroke="#8B5CF6" stroke-width="3" />

  <!-- Top Telemetry Header -->
  <line x1="8" y1="42" x2="892" y2="42" stroke="#1E3A8A" stroke-width="1" />
  <circle cx="28" cy="25" r="5" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <text x="44" y="29" fill="#94A3B8" font-family="monospace" font-size="11.5" font-weight="bold" letter-spacing="1.5">[ ID: LELEKRECING ]</text>
  <text x="260" y="29" fill="#38BDF8" font-family="monospace" font-size="11.5" font-weight="bold" letter-spacing="1.2">★ FULLSTACK WEB & MOBILE ENGINEER</text>
  <text x="645" y="29" fill="#A78BFA" font-family="monospace" font-size="11.5" font-weight="bold" letter-spacing="1.2">STATUS: READY TO DEPLOY</text>

  <!-- Left Animated Orbital Radar System -->
  <g transform="translate(145, 152)">
    <!-- Outer Dashed Orbit -->
    <circle cx="0" cy="0" r="68" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="6 6">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite" />
    </circle>
    <!-- Inner Ring -->
    <circle cx="0" cy="0" r="46" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6" />
    <!-- Pulsing Wave -->
    <circle cx="0" cy="0" r="15" stroke="#38BDF8" stroke-width="2" fill="none">
      <animate attributeName="r" values="15;68" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <!-- Radar Sweep Beam -->
    <g>
      <line x1="0" y1="0" x2="0" y2="-68" stroke="#38BDF8" stroke-width="2.5" />
      <path d="M 0 0 L 0 -68 A 68 68 0 0 1 48 -48 Z" fill="#38BDF8" fill-opacity="0.2" />
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3.5s" repeatCount="indefinite" />
    </g>
    <!-- Orbiting Satellite Node -->
    <g>
      <circle cx="68" cy="0" r="5" fill="#FACC15" />
      <circle cx="-68" cy="0" r="4" fill="#A78BFA" />
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="8s" repeatCount="indefinite" />
    </g>
    <!-- Center Core -->
    <circle cx="0" cy="0" r="14" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" />
    <circle cx="0" cy="0" r="5" fill="#38BDF8">
      <animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Twinkling Stars -->
  <circle cx="52" cy="75" r="2" fill="#FFFFFF">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="240" cy="82" r="2.5" fill="#38BDF8">
    <animate attributeName="opacity" values="1;0.1;1" dur="1.6s" repeatCount="indefinite" />
  </circle>
  <circle cx="55" cy="230" r="2" fill="#A78BFA">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite" />
  </circle>

  <!-- Right Main Terminal Card -->
  <rect x="265" y="58" width="600" height="186" rx="10" fill="url(#cardBg)" stroke="#2563EB" stroke-width="1.5" />

  <!-- Role Tag -->
  <rect x="285" y="72" width="315" height="24" rx="5" fill="#1E3A8A" fill-opacity="0.65" stroke="#38BDF8" stroke-width="1" />
  <text x="298" y="88" fill="#38BDF8" font-family="monospace" font-size="11.5" font-weight="bold" letter-spacing="1.5">FULLSTACK & MOBILE DEVELOPER // ID</text>

  <!-- Main Title -->
  <text x="285" y="134" fill="#FFFFFF" font-family="sans-serif" font-size="38" font-weight="900" letter-spacing="3">LELEKRECING</text>

  <!-- Tech Stack Highlight Line -->
  <text x="285" y="160" fill="#93C5FD" font-family="monospace" font-size="12.5" font-weight="bold" letter-spacing="1">PHP • LARAVEL • JS • NODE.JS • FLUTTER • DART • MYSQL • POSTGRESQL</text>

  <!-- Animated Terminal Typing Line -->
  <text x="285" y="190" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="bold">> Crafting Scalable Web & Cross-Platform Mobile Apps<tspan fill="#FACC15">_<animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" /></tspan></text>

  <!-- Animated Equalizer / Signal Bars on Right -->
  <g transform="translate(795, 76)">
    <rect x="0" y="10" width="5" height="18" rx="2" fill="#38BDF8">
      <animate attributeName="height" values="6;22;6" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="22;6;22" dur="1.1s" repeatCount="indefinite" />
    </rect>
    <rect x="10" y="4" width="5" height="24" rx="2" fill="#8B5CF6">
      <animate attributeName="height" values="22;8;22" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="6;20;6" dur="0.9s" repeatCount="indefinite" />
    </rect>
    <rect x="20" y="12" width="5" height="16" rx="2" fill="#22C55E">
      <animate attributeName="height" values="8;24;8" dur="1.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="20;4;20" dur="1.3s" repeatCount="indefinite" />
    </rect>
    <rect x="30" y="6" width="5" height="22" rx="2" fill="#FACC15">
      <animate attributeName="height" values="20;5;20" dur="1.0s" repeatCount="indefinite" />
      <animate attributeName="y" values="8;23;8" dur="1.0s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Bottom Card Telemetry -->
  <line x1="285" y1="208" x2="845" y2="208" stroke="#1E3A8A" stroke-width="1" />
  <text x="285" y="227" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="bold">BACKEND: <tspan fill="#38BDF8">LARAVEL / NODE</tspan>  |  MOBILE: <tspan fill="#A78BFA">FLUTTER / DART</tspan>  |  DB: <tspan fill="#22C55E">MYSQL & POSTGRES</tspan></text>
</svg>
