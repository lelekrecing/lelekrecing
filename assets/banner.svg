<svg width="1000" height="280" viewBox="0 0 1000 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Neon Accent Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#F472B6;#38BDF8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#F472B6;#38BDF8;#818CF8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34D399">
        <animate attributeName="stop-color" values="#34D399;#38BDF8;#818CF8;#34D399" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.6" />
    </pattern>

    <!-- Clip Path for Rounded Corners -->
    <clipPath id="cardClip">
      <rect x="2" y="2" width="996" height="276" rx="16" />
    </clipPath>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: 2px;
      fill: #F8FAFC;
    }
    .subtitle {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-weight: 600;
      font-size: 18px;
      fill: #38BDF8;
    }
    .badge-text {
      font-family: 'Segoe UI', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1.5px;
      fill: #94A3B8;
    }
    .role-1 {
      opacity: 0;
      animation: roleCycle 12s infinite 0s;
    }
    .role-2 {
      opacity: 0;
      animation: roleCycle 12s infinite 4s;
    }
    .role-3 {
      opacity: 0;
      animation: roleCycle 12s infinite 8s;
    }
    @keyframes roleCycle {
      0%, 5% { opacity: 0; transform: translateY(8px); }
      10%, 28% { opacity: 1; transform: translateY(0px); }
      33%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .pulse-ring {
      transform-origin: 840px 140px;
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.4; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    .float-slow {
      animation: float 5s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
  </style>

  <!-- Main Card Container -->
  <g clip-path="url(#cardClip)">
    <!-- Base Background -->
    <rect width="1000" height="280" fill="url(#bgGrad)" />
    
    <!-- Animated Moving Grid -->
    <g>
      <rect width="1080" height="360" fill="url(#grid)" />
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 -40" dur="4s" repeatCount="indefinite" />
    </g>

    <!-- Ambient Glow Orbs -->
    <circle cx="150" cy="50" r="140" fill="#38BDF8" opacity="0.08" filter="url(#glow)" />
    <circle cx="850" cy="230" r="160" fill="#818CF8" opacity="0.1" filter="url(#glow)" />

    <!-- Animated Bottom Waves -->
    <path d="M0 240 Q 250 200 500 240 T 1000 240 L 1000 280 L 0 280 Z" fill="#38BDF8" opacity="0.08">
      <animate attributeName="d" values="M0 240 Q 250 200 500 240 T 1000 240 L 1000 280 L 0 280 Z;
                M0 240 Q 250 275 500 240 T 1000 240 L 1000 280 L 0 280 Z;
                M0 240 Q 250 200 500 240 T 1000 240 L 1000 280 L 0 280 Z" dur="7s" repeatCount="indefinite" />
    </path>
    <path d="M0 250 Q 250 280 500 250 T 1000 250 L 1000 280 L 0 280 Z" fill="#818CF8" opacity="0.1">
      <animate attributeName="d" values="M0 250 Q 250 280 500 250 T 1000 250 L 1000 280 L 0 280 Z;
                M0 250 Q 250 215 500 250 T 1000 250 L 1000 280 L 0 280 Z;
                M0 250 Q 250 280 500 250 T 1000 250 L 1000 280 L 0 280 Z" dur="5s" repeatCount="indefinite" />
    </path>

    <!-- Left Content Section -->
    <!-- Status Pill -->
    <rect x="60" y="48" width="215" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="78" cy="62" r="4.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="92" y="66" class="badge-text">SYSTEM ONLINE // READY</text>

    <!-- Main Name / Handle -->
    <text x="60" y="132" class="title">LELEKRECING</text>
    
    <!-- Accent Line Under Name -->
    <rect x="60" y="148" width="120" height="4" rx="2" fill="url(#neonGrad)" filter="url(#glow)">
      <animate attributeName="width" values="120;260;120" dur="5s" repeatCount="indefinite" />
    </rect>

    <!-- Animated Rotating Roles -->
    <g transform="translate(60, 192)">
      <text x="0" y="0" class="subtitle" fill="#64748B">>_</text>
      
      <text x="28" y="0" class="subtitle role-1">Fullstack Web Developer • PHP & Laravel</text>
      <text x="28" y="0" class="subtitle role-2">Mobile Engineering • Flutter & Dart</text>
      <text x="28" y="0" class="subtitle role-3">Database Architect • MySQL & PostgreSQL</text>
      
      <rect x="435" y="-14" width="10" height="18" fill="#38BDF8" class="cursor" />
    </g>

    <!-- Right Graphic Section: Animated Tech Core -->
    <g class="float-slow">
      <!-- Outer Rotating Dashed Ring -->
      <circle cx="840" cy="140" r="78" stroke="url(#neonGrad)" stroke-width="2" stroke-dasharray="14 8 4 8" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="0 840 140" to="360 840 140" dur="20s" repeatCount="indefinite" />
      </circle>

      <!-- Inner Counter-Rotating Ring -->
      <circle cx="840" cy="140" r="58" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="30 15" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="360 840 140" to="0 840 140" dur="12s" repeatCount="indefinite" />
      </circle>

      <!-- Glowing Core Circle -->
      <circle cx="840" cy="140" r="42" fill="#0F172A" stroke="url(#neonGrad)" stroke-width="2.5" class="pulse-ring" filter="url(#glow)" />

      <!-- Code Icon Inside Core (< / >) -->
      <path d="M826 130 L814 140 L826 150" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M854 130 L866 140 L854 150" stroke="#818CF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="845" y1="126" x2="835" y2="154" stroke="#34D399" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Floating Particles -->
    <circle cx="720" cy="70" r="2.5" fill="#38BDF8">
      <animate attributeName="cy" values="70;50;70" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="930" cy="85" r="2" fill="#F472B6">
      <animate attributeName="cy" values="85;105;85" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="745" cy="210" r="3" fill="#34D399">
      <animate attributeName="cy" values="210;190;210" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Outer Neon Border -->
  <rect x="2" y="2" width="996" height="276" rx="16" stroke="url(#neonGrad)" stroke-width="2" opacity="0.85" />
</svg>
