<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040B16" />
      <stop offset="50%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#061124" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D3A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#061226" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E3A5F" stroke-width="0.6" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Courier, monospace; }
    .title { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; font-weight: 900; }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }
    @keyframes beamPulse {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.55; }
    }
    @keyframes barLoad {
      0% { width: 10px; }
      50% { width: 75px; }
      100% { width: 10px; }
    }
    .astronaut { animation: float 3.5s ease-in-out infinite; }
    .blink-dot { animation: blink 1.2s infinite; }
    .star-1 { animation: blink 2.2s infinite; }
    .star-2 { animation: blink 3.1s infinite; }
    .beam { animation: beamPulse 2.5s ease-in-out infinite; }
    .pwr-bar { animation: barLoad 4s ease-in-out infinite; }
  </style>

  <!-- Background & Grid -->
  <rect width="900" height="260" rx="10" fill="url(#bgGrad)" />
  <rect width="900" height="260" rx="10" fill="url(#cyberGrid)" />

  <!-- Outer HUD Border & Corner Brackets (Persis Gaya Akid) -->
  <rect x="14" y="14" width="872" height="232" fill="none" stroke="#1E3A5F" stroke-width="1.2" />
  <path d="M 10 34 L 10 10 L 34 10" fill="none" stroke="#38BDF8" stroke-width="2.5" />
  <path d="M 866 10 L 890 10 L 890 34" fill="none" stroke="#38BDF8" stroke-width="2.5" />
  <path d="M 10 226 L 10 250 L 34 250" fill="none" stroke="#38BDF8" stroke-width="2.5" />
  <path d="M 866 250 L 890 250 L 890 226" fill="none" stroke="#38BDF8" stroke-width="2.5" />

  <!-- Top Telemetry Bar -->
  <line x1="14" y1="44" x2="886" y2="44" stroke="#1E3A5F" stroke-width="1" />
  <circle cx="32" cy="29" r="4" fill="#22C55E" class="blink-dot" />
  <text x="45" y="33" fill="#94A3B8" font-size="11" font-weight="bold" letter-spacing="1.5" class="mono">[ CODENAME : LELEKRECING ]</text>
  <text x="275" y="33" fill="#FACC15" font-size="11" font-weight="bold" letter-spacing="1.5" class="mono">★ TECH ARSENAL: 08 STACKS</text>
  <text x="515" y="33" fill="#94A3B8" font-size="11" font-weight="bold" letter-spacing="1.5" class="mono">SYSTEMS: v2.6</text>
  <text x="655" y="33" fill="#38BDF8" font-size="11" font-weight="bold" letter-spacing="1.5" class="mono">MISSION: SIMERAH KOJA & PLN</text>

  <!-- Background Space Stars -->
  <circle cx="55" cy="75" r="1.5" fill="#FFFFFF" class="star-1" />
  <circle cx="195" cy="68" r="2" fill="#38BDF8" class="star-2" />
  <circle cx="240" cy="110" r="1" fill="#FFFFFF" class="star-1" />
  <circle cx="70" cy="215" r="1.5" fill="#38BDF8" class="star-2" />
  <circle cx="220" cy="220" r="1.5" fill="#FFFFFF" class="star-1" />
  <circle cx="140" cy="95" r="1" fill="#FACC15" class="star-2" />

  <!-- Floating Pixel Astronaut & Flashlight Beam (Left Scene) -->
  <g class="astronaut">
    <!-- Tether Cord -->
    <path d="M 14 165 Q 55 185 88 152" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" />
    <!-- Flashlight Cone Beam -->
    <polygon points="122,146 285,105 285,190" fill="#38BDF8" class="beam" />
    <!-- Pixel Astronaut Body -->
    <g transform="translate(82, 122)">
      <!-- Backpack -->
      <rect x="2" y="10" width="8" height="20" rx="2" fill="#94A3B8" />
      <!-- Helmet -->
      <rect x="10" y="0" width="22" height="18" rx="4" fill="#FFFFFF" />
      <!-- Visor -->
      <rect x="18" y="4" width="12" height="10" rx="2" fill="#FACC15" />
      <!-- Suit Body -->
      <rect x="10" y="18" width="20" height="18" rx="2" fill="#F8FAFC" />
      <rect x="15" y="22" width="10" height="8" fill="#38BDF8" />
      <!-- Arms & Flashlight -->
      <rect x="26" y="20" width="10" height="6" fill="#FFFFFF" />
      <rect x="36" y="19" width="5" height="8" fill="#FACC15" />
      <!-- Legs -->
      <rect x="11" y="36" width="7" height="10" fill="#E2E8F0" />
      <rect x="22" y="36" width="7" height="10" fill="#E2E8F0" />
    </g>
  </g>

  <!-- Right Main HUD Card -->
  <rect x="285" y="60" width="580" height="172" rx="6" fill="url(#cardGrad)" stroke="#1E40AF" stroke-width="1.2" />

  <!-- Class Badge -->
  <rect x="305" y="76" width="310" height="22" rx="3" fill="#0F294A" stroke="#0284C7" stroke-width="0.8" />
  <text x="315" y="91" fill="#38BDF8" font-size="10.5" font-weight="bold" letter-spacing="1.8" class="mono">FULLSTACK & MOBILE ARCHITECT // CLASS S</text>

  <!-- Main Name -->
  <text x="305" y="132" fill="#FFFFFF" font-size="31" letter-spacing="3.5" class="title">LELEKRECING</text>

  <!-- Stack Subtitle -->
  <text x="305" y="156" fill="#93C5FD" font-size="11.5" font-weight="bold" letter-spacing="1.4" class="mono">PHP • LARAVEL • JS • NODE.JS • FLUTTER • DART • SQL</text>

  <!-- Terminal Command Prompt -->
  <text x="305" y="185" fill="#E2E8F0" font-size="11.5" font-weight="bold" letter-spacing="1.3" class="mono">> CHARTING SCALABLE WEB & MOBILE UNIVERSES<tspan fill="#38BDF8" class="blink-dot">_</tspan></text>

  <!-- Bottom Card Status & Animated Power Bar -->
  <line x1="305" y1="198" x2="845" y2="198" stroke="#1E3A5F" stroke-width="1" />
  <text x="305" y="216" fill="#64748B" font-size="10.5" font-weight="bold" letter-spacing="1.2" class="mono">SYS: <tspan fill="#22C55E">ONLINE</tspan> | DB: <tspan fill="#38BDF8">MYSQL & POSTGRES</tspan> | PWR: <tspan fill="#E2E8F0">100%</tspan></text>
  <rect x="755" y="207" width="80" height="8" rx="4" fill="#0F172A" stroke="#1E3A5F" stroke-width="1" />
  <rect x="757" y="209" width="70" height="4" rx="2" fill="#38BDF8" class="pwr-bar" />
</svg>
