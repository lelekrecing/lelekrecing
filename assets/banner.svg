<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#34D399;#38BDF8" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#34D399;#38BDF8;#818CF8" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="260" rx="14" fill="url(#bg)" />
  <rect width="1000" height="260" rx="14" fill="url(#grid)" opacity="0.5" />
  <rect x="2" y="2" width="996" height="256" rx="13" fill="none" stroke="url(#accent)" stroke-width="2.5" />

  <!-- Animated Wave Bottom -->
  <path d="M0 215 Q 250 185 500 215 T 1000 215 L 1000 260 L 0 260 Z" fill="#38BDF8" opacity="0.12">
    <animate attributeName="d" values="M0 215 Q 250 185 500 215 T 1000 215 L 1000 260 L 0 260 Z;M0 215 Q 250 245 500 215 T 1000 215 L 1000 260 L 0 260 Z;M0 215 Q 250 185 500 215 T 1000 215 L 1000 260 L 0 260 Z" dur="6s" repeatCount="indefinite" />
  </path>

  <!-- Status Badge -->
  <rect x="55" y="42" width="210" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <circle cx="73" cy="55" r="4" fill="#10B981">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <text x="86" y="59" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5">SYSTEM ONLINE // ACTIVE</text>

  <!-- Main Title -->
  <text x="55" y="122" fill="#F8FAFC" font-family="sans-serif" font-size="46" font-weight="bold" letter-spacing="3">LELEKRECING</text>

  <!-- Animated Line -->
  <rect x="55" y="138" width="140" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="140;320;140" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- Subtitle -->
  <text x="55" y="178" fill="#38BDF8" font-family="monospace" font-size="18" font-weight="bold">Fullstack Web & Mobile Developer • System Architect</text>

  <!-- Right Rotating Core Graphic -->
  <g transform="translate(830, 130)">
    <circle r="68" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="16 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite" />
    </circle>
    <circle r="48" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="24 12" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle r="34" fill="#0F172A" stroke="url(#accent)" stroke-width="2" />
    <path d="M-12 -8 L-22 0 L-12 8" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M12 -8 L22 0 L12 8" fill="none" stroke="#818CF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="4" y1="-11" x2="-4" y2="11" stroke="#34D399" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
